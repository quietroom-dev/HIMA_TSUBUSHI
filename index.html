<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暇つぶしゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ★タイトル（ゲームエリアの上） -->
<div id="title-screen">
    <h1>暇つぶしゲーム</h1>

    <p class="description">
    画面に出てくるいろんな暇を<br>
    タップで潰してください。
</p>

</div>

<!-- ★ゲームエリア（ランキング＋開始ボタン） -->
<div id="game-area">
    <div id="ranking-area">
        <h2>ランキング</h2>
        <ul id="ranking-list"></ul>
    </div>

    <button id="title-start-btn" class="start-inside">ゲーム開始</button>
</div>
    <button id="share-btn" class="share-button">このゲームを紹介する</button>


<div id="score" class="hidden">スコア: 0</div>

<div id="game-over" class="hidden">
    <h2>ゲーム終了</h2>
    <p id="game-over-message"></p>

    <h3>ランキング</h3>
    <ul id="ranking-list-gameover"></ul>

    <button id="restart-btn">もう一度遊ぶ</button>
    <button id="share-btn-gameover" class="share-button">このゲームを紹介する</button>
</div>

<footer id="ad-footer">
    <a href="https://quietroom-dev.github.io/QuietRoom/" target="_blank" class="ad-link">
<div style="font-size:12px;color:#888;">
          ✨アプリ紹介✨<br>
        📱 誰かわからん通話<br>
    匿名・モザイクで安心して話せるビデオ通話<br>
    完全無料、インストール不要で利用可能👍
</div>
</footer>


<script src="game.js"></script>
</body>
</html>
