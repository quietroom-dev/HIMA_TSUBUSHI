<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暇つぶしゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

        <!-- ★ゲーム画面 -->
<div id="game-area">

    <!-- ★タイトル画面（ゲームエリア内に移動） -->
    <div id="title-screen">
        <h1>暇つぶしゲーム</h1>

        <h2>ランキング</h2>
        <ul id="ranking-list"></ul>

        <button id="title-start-btn">ゲーム開始</button>
    </div>

</div>

<!-- スコアとゲームオーバーはゲームエリアの外でOK -->
<div id="score" class="hidden">スコア: 0</div>

<div id="game-over" class="hidden">
    <h2>ゲーム終了</h2>
    <p id="game-over-message"></p>

    <h3>ランキング</h3>
    <ul id="ranking-list-gameover"></ul>

    <button id="restart-btn">もう一度遊ぶ</button>
</div>


    </main>

    <!-- ★広告スペース（フッター） -->
    <footer id="ad-space">
        広告スペース（ここにバナーを入れる）
    </footer>

    <script src="game.js"></script>
</body>
</html>
