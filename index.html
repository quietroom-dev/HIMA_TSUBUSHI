<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暇つぶしゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>

<!-- ★タイトル画面（ゲームエリアの外） -->
<div id="title-screen">
    <h1>暇つぶしゲーム</h1>

    <h2>ランキング</h2>
    <ul id="ranking-list"></ul>
</div>

<!-- ★ゲームエリア（開始ボタンはここに置く） -->
<div id="game-area">
    <button id="title-start-btn" class="start-inside">ゲーム開始</button>
</div>

<div id="score" class="hidden">スコア: 0</div>

<div id="game-over" class="hidden">
    <h2>ゲーム終了</h2>
    <p id="game-over-message"></p>

    <h3>ランキング</h3>
    <ul id="ranking-list-gameover"></ul>

    <button id="restart-btn">もう一度遊ぶ</button>
</div>

    </main>

    <!-- ★広告スペース（フッター） -->
    <footer id="ad-space">
        広告スペース（ここにバナーを入れる）
    </footer>

    <script src="game.js"></script>
</body>
</html>
